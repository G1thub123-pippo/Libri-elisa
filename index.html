<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libri a voce</title>
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#f2b705">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8e7;--card:#fffdf6;--ink:#2a2418;--mute:#8a7d5c;--line:#eee3bd;--acc:#f2b705;--rec:#d6332b}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#262320;--ink:#ece6dc;--mute:#9c9286;--line:#3a3530;--acc:#f5c518}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:12px 14px}
header h1{flex:1;margin:0;font:600 19px Literata,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#2a2418;font-weight:600}
button.ghost{border:none;background:none;padding:6px 8px}
main{max-width:760px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.book{background:var(--card);border:1px solid var(--line);border-radius:6px 12px 12px 6px;border-left:6px solid var(--acc);padding:14px;min-height:150px;display:flex;flex-direction:column;cursor:pointer}
.book b{font:600 17px Literata,serif;flex:1}
.book small{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:50px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:57px;z-index:4}
.tabs button{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.ttl{width:100%;font:600 22px Literata,serif;border:none;background:none;color:var(--ink);padding:6px 0;outline:none;border-bottom:1px dashed var(--line)}
textarea{width:100%;min-height:55vh;resize:vertical;border:none;background:var(--card);color:var(--ink);font:17px/1.7 Literata,serif;padding:16px;border-radius:12px;outline:none;margin-top:10px;border:1px solid var(--line)}
.partial{color:var(--mute);font-style:italic;min-height:20px;padding:6px 4px;font-family:Literata,serif}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.mic{width:58px;height:58px;border-radius:50%;font-size:24px;display:grid;place-items:center;padding:0}
.mic{position:relative;width:auto!important;min-width:150px;border-radius:30px!important;gap:8px;display:flex!important;align-items:center;justify-content:center;font-size:15px!important;font-weight:600;padding:0 18px!important}
.mic::after{content:'Avvia ascolto'}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:p 1.4s infinite;box-shadow:inset 0 3px 6px rgba(0,0,0,.3);transform:translateY(1px)}
.mic.on::after{content:'In ascolto · Ferma'}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(214,51,43,.15)}}
.st{font-size:12px;color:var(--mute);flex:1}
.toc h2{font:600 24px Literata,serif;text-align:center}
.toc ol{list-style:none;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px dotted var(--line);cursor:pointer;font-family:Literata,serif;font-size:17px}
.toc li span.n{color:#c08f00;width:28px}
.toc li span.t{flex:1}
.toc li small{color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20;padding:20px}
.modal div.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:380px}
.modal input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0}
.hide{display:none!important}

/* libreria */
.shelf{--row:230px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 4px;padding:0 14px;border-radius:6px;
 background:linear-gradient(#5a3b22,#3f2914);box-shadow:inset 0 0 30px rgba(0,0,0,.5);
 background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 16px),#a8774a calc(var(--row) - 16px),#7a5230 calc(var(--row) - 4px),#2c1c0d var(--row)),linear-gradient(#4a311b,#35220f)}
.slot{height:230px;display:flex;align-items:flex-end;padding-bottom:16px}
.spine{writing-mode:vertical-rl;transform:rotate(180deg);cursor:pointer;border-radius:3px 3px 2px 2px;display:flex;align-items:center;justify-content:space-between;padding:12px 0;
 font:600 15px Literata,serif;color:#fff8e6;text-shadow:0 1px 1px rgba(0,0,0,.4);
 box-shadow:inset -4px 0 6px rgba(0,0,0,.25),inset 3px 0 3px rgba(255,255,255,.2),2px 0 3px rgba(0,0,0,.4);
 background-image:linear-gradient(to right,rgba(0,0,0,.18),transparent 25%,rgba(255,255,255,.12) 50%,transparent 75%,rgba(0,0,0,.2));transition:transform .15s}
.spine:hover{transform:rotate(180deg) translateX(4px)}
.spine .t{max-height:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine .b{border-top:2px solid rgba(255,230,150,.7);border-bottom:2px solid rgba(255,230,150,.7);height:20px;width:100%}
.spine small{font:500 10px Inter;opacity:.8;white-space:nowrap}
/* pagina */
.page{background:#fffbef;background-image:linear-gradient(to right,rgba(0,0,0,.07),transparent 6%,transparent 94%,rgba(0,0,0,.04));
 border-radius:2px 8px 8px 2px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 8px 24px rgba(80,60,10,.15),6px 6px 0 -2px #f3ead2,6px 6px 0 -1px #ddd0a8,11px 11px 0 -4px #efe4c6,11px 11px 0 -3px #d7c89c;
 padding:34px 30px 20px 38px;margin:10px 8px 24px 0;color:#2b2418}
.page input.ttl{text-align:center;border-bottom:none;font-size:24px;color:#2b2418}
.page .orn{text-align:center;color:#c9a227;letter-spacing:8px;margin:2px 0 8px}
.page textarea{background:transparent;border:none;border-radius:0;padding:4px 0;color:#2b2418;font:18px/32px Literata,serif;text-align:justify;hyphens:auto;
 background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(180,150,60,.18) 31px,rgba(180,150,60,.18) 32px);background-attachment:local;min-height:60vh}
.page .folio{text-align:center;color:#9c8a5a;font:italic 13px Literata,serif;margin-top:8px}
.tools{display:flex;gap:6px;justify-content:center;margin:0 0 8px}
.tools button{font-size:12px;padding:5px 9px}
.ver{text-align:center;color:var(--mute);font-size:12px;margin:18px 0}</style>
</head>
<body>
<header><button class="ghost hide" id="back">‹</button><h1 id="htitle">Libreria</h1><span id="hact"></span><button class="ghost" id="auth" title="Accedi">👤</button></header>
<div id="tabs" class="tabs hide"></div>
<main id="main"></main>
<div id="bar" class="bar hide">
  <span class="st" id="st">Scrivi o tocca il microfono</span>
  <button class="mic" id="mic" title="Dettatura" aria-pressed="false"><span id="mico">🎙</span></button>
  <span class="st" id="cnt" style="text-align:right"></span>
</div>
<div id="modal" class="modal hide"><div class="box"><b id="mq"></b><input id="mi"><div class="row" style="justify-content:flex-end"><button id="mno">Annulla</button><button class="pri" id="mok">OK</button></div></div></div>
<script>
const VERSIONE='1.0.0';
const $=s=>document.querySelector(s);
let armed=false,books=[],cur=null,chap=null,listening=false,saveT=null;
const LS='libri-voce';
const uidGen=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function lsLoad(){try{books=JSON.parse(localStorage.getItem(LS))||[]}catch(e){books=[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(books))}catch(e){}}
lsLoad();
function persist(b){b.updated=Date.now();lsSave();clearTimeout(saveT);
  saveT=setTimeout(()=>{window.cloud&&window.cloud.save(b)},800)}
function ask(q,v=''){return new Promise(r=>{$('#mq').textContent=q;$('#mi').value=v;$('#mi').type=q==='Password'?'password':q==='Email'?'email':'text';$('#modal').classList.remove('hide');$('#mi').focus();
  const done=x=>{$('#modal').classList.add('hide');$('#mok').onclick=$('#mno').onclick=$('#mi').onkeydown=null;r(x)};
  $('#mok').onclick=()=>done($('#mi').value.trim());$('#mno').onclick=()=>done(null);
  $('#mi').onkeydown=e=>{if(e.key==='Enter')done($('#mi').value.trim())}})}
const words=t=>(t.trim().match(/\S+/g)||[]).length;

function render(){
  stopDict();
  if(!cur){ // libreria
    $('#back').classList.add('hide');$('#tabs').classList.add('hide');$('#bar').classList.add('hide');
    $('#htitle').textContent='Libreria';
    $('#hact').innerHTML='<button class="ghost" id="ex" title="Salva backup">⤓</button><button class="ghost" id="im" title="Carica backup">⤒</button><button class="pri" id="nb">+ Nuovo libro</button>';
    $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(books)],{type:'application/json'}));a.download='libri-backup.json';a.click()};
    $('#im').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());const ids=new Set(books.map(b=>b.id));d.forEach(b=>{if(!ids.has(b.id))books.push(b)});lsSave();render()}catch(e){}};f.click()};
    $('#nb').onclick=async()=>{const t=await ask('Titolo del libro');if(!t)return;
      const b={id:uidGen(),title:t,chapters:[{id:uidGen(),title:'Capitolo 1',text:''}],updated:Date.now()};
      books.push(b);persist(b);open(b.id)};
    const list=[...books].sort((a,b)=>b.updated-a.updated);
    const pal=['#7a1f1f','#1f3d5c','#2f5a34','#5c3d1f','#4a2a5c','#8a6a12','#23484a','#6b2b45','#3a3a3a','#9a4a1a'];
    const hash=t=>[...t].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
    $('#main').innerHTML=list.length?'<div class="shelf">'+list.map(b=>{const h=hash(b.id);return `<div class="slot"><div class="spine" data-id="${b.id}" style="background-color:${pal[h%pal.length]};height:${170+h%40}px;width:${44+h%18}px"><span class="b"></span><span class="t">${esc(b.title)}</span><small>${b.chapters.length} cap.</small></div></div>`}).join('')+'<div class="slot" style="flex:1"></div></div><p class="ver">Libri a voce · versione '+VERSIONE+'</p>':'<div class="empty">La libreria è vuota. Crea il primo libro con “+ Nuovo libro”.</div><p class="ver">Libri a voce · versione '+VERSIONE+'</p>';
    document.querySelectorAll(".spine").forEach(e=>e.onclick=()=>open(e.dataset.id));
    return;
  }
  const b=cur;
  $('#back').classList.remove('hide');$('#tabs').classList.remove('hide');
  $('#htitle').textContent=b.title;
  $('#hact').innerHTML='<button class="ghost" id="rb" title="Rinomina">✎</button><button class="ghost" id="db" title="Elimina">🗑</button>';
  $('#rb').onclick=async()=>{const t=await ask('Titolo del libro',b.title);if(t){b.title=t;persist(b);render()}};
  $('#db').onclick=async()=>{const t=await ask('Scrivi ELIMINA per cancellare il libro');if(t==='ELIMINA'){books=books.filter(x=>x!==b);lsSave();window.cloud&&window.cloud.del(b.id);cur=null;render()}};
  $('#tabs').innerHTML=`<button data-c="idx" class="${chap==='idx'?'on':''}">☰ Indice</button>`+b.chapters.map((c,i)=>`<button data-c="${c.id}" class="${chap===c.id?'on':''}">${i+1}. ${esc(c.title)}</button>`).join('')+'<button data-c="new">+ Capitolo</button>';
  $('#tabs').querySelectorAll('button').forEach(e=>e.onclick=async()=>{
    if(e.dataset.c==='new'){const t=await ask('Titolo del capitolo','Capitolo '+(b.chapters.length+1));if(!t)return;const c={id:uidGen(),title:t,text:''};b.chapters.push(c);persist(b);chap=c.id}
    else chap=e.dataset.c;render()});
  if(chap==='idx'){ // indice
    $('#bar').classList.add('hide');
    $('#main').innerHTML=`<div class="toc"><h2>${esc(b.title)}</h2><h3 style="text-align:center;color:var(--mute);font-weight:500">Indice</h3><ol>`+
      b.chapters.map((c,i)=>`<li data-c="${c.id}"><span class="n">${i+1}</span><span class="t">${esc(c.title)}</span><small>${words(c.text)} parole</small></li>`).join('')+
      `</ol><p style="color:var(--mute);font-size:13px;text-align:center">Totale ${b.chapters.reduce((s,c)=>s+words(c.text),0)} parole</p></div>`;
    $('#main').querySelectorAll('li').forEach(e=>e.onclick=()=>{chap=e.dataset.c;render()});
    return;
  }
  const c=b.chapters.find(x=>x.id===chap)||b.chapters[0];chap=c.id;
  const i=b.chapters.indexOf(c);
  $('#bar').classList.remove('hide');
  $('#main').innerHTML=`<div class="page"><div class="tools"><button id="up" ${i?'':'disabled'}>↑</button><button id="dn" ${i<b.chapters.length-1?'':'disabled'}>↓</button><button id="del">Elimina capitolo</button></div>
  <div class="orn">Capitolo ${i+1}</div><input class="ttl" id="ct" value="${esc(c.title)}"><div class="orn">❦</div>
  <textarea id="tx" placeholder="C'era una volta…">${esc(c.text)}</textarea><div class="partial" id="pt"></div><div class="folio">— ${i+1} —</div></div>`;
  const tx=$('#tx');
  $('#ct').oninput=e=>{c.title=e.target.value;persist(b);const t=$('#tabs').querySelector(`[data-c="${c.id}"]`);if(t)t.textContent=(i+1)+'. '+c.title};
  tx.oninput=()=>{c.text=tx.value;persist(b);count()};
  const mv=d=>{b.chapters.splice(i,1);b.chapters.splice(i+d,0,c);persist(b);render()};
  $('#up').onclick=()=>mv(-1);$('#dn').onclick=()=>mv(1);
  $('#del').onclick=async()=>{if(b.chapters.length<2){await ask('Un libro deve avere almeno un capitolo');return}
    const t=await ask('Scrivi ELIMINA per cancellare “'+c.title+'”');if(t==='ELIMINA'){b.chapters.splice(i,1);chap=b.chapters[Math.max(0,i-1)].id;persist(b);render()}};
  count();
}
function count(){const t=$('#tx');if(t)$('#cnt').textContent=words(t.value)+' parole'}
function open(id){cur=books.find(b=>b.id===id);chap=cur.chapters[0].id;render();scrollTo(0,0)}
$('#back').onclick=()=>{cur=null;render()};
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function setArmed(v){armed=v;const m=$('#mic');m.classList.toggle('on',v);m.setAttribute('aria-pressed',v);if(!v)$('#st').textContent='Scrivi o tocca il microfono'}
// dettatura con Web Speech API
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function insertText(text){
  const tx=$('#tx');if(!tx||!text)return;
  const s=tx.selectionStart,e=tx.selectionEnd,v=tx.value;
  const before=v.slice(0,s),after=v.slice(e);
  let ins=text.trim();if(!ins)return;
  if(before&&!/\s$/.test(before))ins=' '+ins;
  if(!before.trim()||/[.!?]\s*$/.test(before))ins=ins.replace(/^(\s*)(\S)/,(m,a,b)=>a+b.toUpperCase());
  if(after&&!/^\s/.test(after))ins+=' ';
  tx.value=before+ins+after;const pos=(before+ins).length;tx.setSelectionRange(pos,pos);
  tx.dispatchEvent(new Event('input'));
}
function startRec(){
  rec=new SR();rec.lang='it-IT';rec.continuous=true;rec.interimResults=true;
  rec.onresult=ev=>{let part='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];
    if(r.isFinal)insertText(r[0].transcript);else part+=r[0].transcript}
    const p=$('#pt');if(p)p.textContent=part};
  rec.onstart=()=>{listening=true;$('#st').textContent='In ascolto… il testo va dove c’è il cursore'};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){setArmed(false);$('#st').textContent='Microfono non autorizzato'}};
  rec.onend=()=>{listening=false;const p=$('#pt');if(p)p.textContent='';if(armed){try{startRec()}catch(e){}}};
  rec.start();
}
$('#mic').onclick=()=>{
  if(armed){setArmed(false);if(rec){rec.onend=null;rec.stop();listening=false;const p=$('#pt');if(p)p.textContent=''}return}
  if(!SR){$('#st').textContent='Questo browser non supporta la dettatura: usa Chrome o Safari';return}
  setArmed(true);try{startRec()}catch(e){setArmed(false)}};
function stopDict(){if(armed){setArmed(false);if(rec){rec.onend=null;try{rec.stop()}catch(e){}}listening=false}}
render();
</script>
<script type="module">
import {firebaseConfig} from './config.js?v=1.0.0';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,setPersistence,browserLocalPersistence,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,getDocs,doc,setDoc,deleteDoc,enableIndexedDbPersistence} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
try{await enableIndexedDbPersistence(fs)}catch(e){}
let user=null;const ref=id=>doc(fs,'users',user.uid,'books',id);
window.cloud={save:b=>user&&setDoc(ref(b.id),JSON.parse(JSON.stringify(b))).catch(e=>console.warn(e)),del:id=>user&&deleteDoc(ref(id)).catch(()=>{})};
const btn=document.getElementById('auth');
setPersistence(auth,browserLocalPersistence).catch(()=>{});
btn.onclick=async()=>{
  if(user){if(confirm('Uscire dall\'account '+(user.email||'')+'?'))signOut(auth);return}
  const em=await ask('Email');if(!em)return;
  const pw=await ask('Password');if(!pw)return;
  try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){
    if(!confirm('Accesso non riuscito.\n\nSe è un nuovo utente premi OK per crearlo con questa email e password.\nSe hai sbagliato la password premi Annulla.'))return;
    try{await createUserWithEmailAndPassword(auth,em,pw)}catch(e2){
      const m={'auth/email-already-in-use':'Utente già esistente: la password è sbagliata','auth/weak-password':'Password troppo corta (minimo 6 caratteri)','auth/invalid-email':'Email non valida'};
      alert(m[e2.code]||('Errore: '+e2.code))}}
};
onAuthStateChanged(auth,async u=>{
  user=u;btn.textContent=u?'☁️':'👤';btn.title=u?('Sincronizzato: '+u.email):'Accedi per sincronizzare';
  if(!u)return;
  try{
    const snap=await getDocs(collection(fs,'users',u.uid,'books'));
    const remote=new Map();snap.forEach(d=>remote.set(d.id,d.data()));
    for(const b of books){const r=remote.get(b.id);
      if(!r||(b.updated||0)>(r.updated||0)){remote.set(b.id,b);await window.cloud.save(b)}}
    books.length=0;remote.forEach(b=>books.push(b));lsSave();
    if(cur)cur=books.find(b=>b.id===cur.id)||null;
    if(!document.activeElement||document.activeElement.id!=='tx')render();
  }catch(e){alert('Errore sincronizzazione: '+(e.code||e.message))}
});
</script>
</body>
</html>
